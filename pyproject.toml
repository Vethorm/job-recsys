[project]
name = "job-recsys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vethorm", email = "13478023+Vethorm@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "httpx>=0.28.1",
    "ipykernel>=6.29.5",
    "loguru>=0.7.3",
    "pydantic>=2.11.2",
    "pypdf>=5.3.1",
    "scrapy>=2.12.0",
    "sentence-transformers>=3.4.1",
    "streamlit>=1.43.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
run-job-spiders = "job_recsys.scripts.run_spider:main"
