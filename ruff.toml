line-length = 120

[lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N", # pep8-naming
    "D", # pydocstyle
    "T20", # flake8-print
    "PL", # pylint
    "RUF", # ruff-specific rules
]
ignore = [
    "D100", # missing docstring in public module
    "UP015", # Unnecessary open mode argument
]


[lint.pydocstyle]
convention = "google"


[lint.per-file-ignores]
"__init__.py" = ["E402", "D104"]